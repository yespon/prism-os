# PrismOS - Production Environment
# Usage: ./scripts/deploy.sh up
#
# Services:
#   - nginx:       Reverse proxy (port 2026, configurable via PORT env var)
#   - frontend:    Next.js production server
#   - gateway:     FastAPI Gateway API
#   - langgraph:   LangGraph production server
#   - db-init:     Database migration runner (alembic upgrade head)
#   - postgres:    (optional) PostgreSQL database, profile: postgres
#   - provisioner: (optional) Sandbox provisioner for Kubernetes mode
#
# Key environment variables (set via scripts/deploy.sh):
#   PRISMOS_HOME                     — runtime data dir, default $REPO_ROOT/backend/.prismos
#   PRISMOS_CONFIG_PATH              — path to config.yaml
#   PRISMOS_DOCKER_SOCKET            — Docker socket path, default /var/run/docker.sock
#   PRISMOS_REPO_ROOT                — repo root (used for skills host path in DooD)
#
# Database modes:
#   - SQLite (default): no extra services needed, db-init creates the file
#   - PostgreSQL: run with --profile postgres, set config.yaml database.url accordingly
#
# Access: http://localhost:${PORT:-2026}

name: prismos

services:
  # ── Database Migration (runs before gateway/langgraph) ─────────────────────
  db-init:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: prismos-db-init:latest
    container_name: prismos-db-init
    command: sh -c "cd backend && PYTHONPATH=. uv run alembic upgrade head"
    volumes:
      - ${PRISMOS_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      - ${PRISMOS_HOME:-../backend/.prismos}:/app/backend/.prismos
    working_dir: /app
    environment:
      - CI=true
      - PRISMOS_HOME=/app/backend/.prismos
    networks:
      - prismos
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  # ── PostgreSQL (optional, profile: postgres) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: prismos-postgres
    profiles:
      - postgres
    environment:
      POSTGRES_USER: ${PRISMOS_POSTGRES_USER:-${POSTGRES_USER:-prismos}}
      POSTGRES_PASSWORD: ${PRISMOS_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-prismos}}
      POSTGRES_DB: ${PRISMOS_POSTGRES_DB:-${POSTGRES_DB:-prismos}}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    networks:
      - prismos
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PRISMOS_POSTGRES_USER:-${POSTGRES_USER:-prismos}} -d ${PRISMOS_POSTGRES_DB:-${POSTGRES_DB:-prismos}}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

  # ── Reverse Proxy ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: prismos-nginx
    ports:
      - "${PORT:-2026}:2026"
    volumes:
      - ./nginx/${NGINX_CONF:-nginx.conf}:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      gateway:
        condition: service_healthy
      langgraph:
        condition: service_healthy
    networks:
      - prismos
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M

  # ── Frontend: Next.js Production ───────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL:-}
        NEXT_PUBLIC_LANGGRAPH_BASE_URL: ${NEXT_PUBLIC_LANGGRAPH_BASE_URL:-}
    image: prismos-frontend:latest
    container_name: prismos-frontend
    volumes:
      - ${PRISMOS_CONFIG_PATH:-../config.yaml}:/app/config.yaml:ro
      - ${PRISMOS_HOME:-../backend/.prismos}:/app/backend/.prismos
    environment:
      SERVER_BACKEND_URL: http://gateway:8001
    networks:
      - prismos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

  # ── Gateway API ────────────────────────────────────────────────────────────
  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: prismos-gateway:latest
    container_name: prismos-gateway
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    volumes:
      - ${PRISMOS_CONFIG_PATH:-../config.yaml}:/app/backend/config.yaml:ro
      - ../skills:/app/skills:ro
      - ${PRISMOS_HOME:-../backend/.prismos}:/app/backend/.prismos
      - ${PRISMOS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    working_dir: /app
    environment:
      - CI=true
      - PRISMOS_TRUSTED_GRAPH_CONTEXT=${PRISMOS_TRUSTED_GRAPH_CONTEXT:-off}
      - PRISMOS_GOVERNED_TICKET_TENANT=${PRISMOS_GOVERNED_TICKET_TENANT:-}
      - PRISMOS_GOVERNED_TICKET_ACTION=${PRISMOS_GOVERNED_TICKET_ACTION:-off}
      - PRISMOS_GOVERNED_TICKET_VERDICT=${PRISMOS_GOVERNED_TICKET_VERDICT:-deny}
      - PRISMOS_GOVERNED_TICKET_POLICY_VERSION=${PRISMOS_GOVERNED_TICKET_POLICY_VERSION:-v1}
      - PRISMOS_HOME=/app/backend/.prismos
      - PRISMOS_HOST_BASE_DIR=${PRISMOS_HOME:-${OPSINTECH_HOME:-../backend/.prismos}}
      - PRISMOS_HOST_SKILLS_PATH=${PRISMOS_REPO_ROOT:-${OPSINTECH_REPO_ROOT:-..}}/skills
      - PRISMOS_SANDBOX_HOST=host.docker.internal
      # Legacy aliases remain for modules that still read OPSINTECH_* directly.
      - OPSINTECH_HOME=/app/backend/.prismos
      - OPSINTECH_HOST_BASE_DIR=${PRISMOS_HOME:-${OPSINTECH_HOME:-../backend/.prismos}}
      - OPSINTECH_HOST_SKILLS_PATH=${PRISMOS_REPO_ROOT:-${OPSINTECH_REPO_ROOT:-..}}/skills
      - OPSINTECH_SANDBOX_HOST=host.docker.internal
      - CORS_ORIGINS=http://localhost:${PORT:-2026},http://frontend:3000
      - FRONTEND_URL=http://frontend:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prismos
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G

  # ── LangGraph Server ───────────────────────────────────────────────────────
  # Uses `langgraph dev` (no license required) in production mode (--no-reload).
  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    image: prismos-langgraph:latest
    container_name: prismos-langgraph
    command: sh -c "cd /app/backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    volumes:
      - ${PRISMOS_CONFIG_PATH:-../config.yaml}:/app/config.yaml:ro
      - ${PRISMOS_HOME:-../backend/.prismos}:/app/backend/.prismos
      - ../skills:/app/skills:ro
      - ../backend/.langgraph_api:/app/backend/.langgraph_api
      - ${PRISMOS_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    environment:
      - CI=true
      - PRISMOS_TRUSTED_GRAPH_CONTEXT=${PRISMOS_TRUSTED_GRAPH_CONTEXT:-off}
      - PRISMOS_GOVERNED_TICKET_TENANT=${PRISMOS_GOVERNED_TICKET_TENANT:-}
      - PRISMOS_GOVERNED_TICKET_ACTION=${PRISMOS_GOVERNED_TICKET_ACTION:-off}
      - PRISMOS_GOVERNED_TICKET_VERDICT=${PRISMOS_GOVERNED_TICKET_VERDICT:-deny}
      - PRISMOS_GOVERNED_TICKET_POLICY_VERSION=${PRISMOS_GOVERNED_TICKET_POLICY_VERSION:-v1}
      - PRISMOS_HOME=/app/backend/.prismos
      - PRISMOS_CONFIG_PATH=/app/config.yaml
      - PRISMOS_HOST_BASE_DIR=${PRISMOS_HOME:-../backend/.prismos}
      - PRISMOS_HOST_SKILLS_PATH=${PRISMOS_REPO_ROOT:-..}/skills
      - PRISMOS_SANDBOX_HOST=host.docker.internal
      # Legacy aliases remain for modules that still read OPSINTECH_* directly.
      - OPSINTECH_HOME=/app/backend/.prismos
      - OPSINTECH_CONFIG_PATH=/app/config.yaml
      - OPSINTECH_HOST_BASE_DIR=${PRISMOS_HOME:-../backend/.prismos}
      - OPSINTECH_HOST_SKILLS_PATH=${PRISMOS_REPO_ROOT:-..}/skills
      - OPSINTECH_SANDBOX_HOST=host.docker.internal
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - PRISMOS_RUNTIME_ADAPTER_MODULE=${PRISMOS_RUNTIME_ADAPTER_MODULE:-app.runtime_adapters}
      - CORS_ORIGINS=http://localhost:${PORT:-2026},http://frontend:3000
      - FRONTEND_URL=http://frontend:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prismos
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2024/ok"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: 4G

  # ── Sandbox Provisioner (optional, Kubernetes mode) ────────────────────────
  provisioner:
    profiles:
      - provisioner
    build:
      context: ./provisioner
      dockerfile: Dockerfile
    image: prismos-provisioner:latest
    container_name: prismos-provisioner
    volumes:
      - ~/.kube/config:/root/.kube/config:ro
    environment:
      - K8S_NAMESPACE=${PRISMOS_K8S_NAMESPACE:-prismos}
      - SANDBOX_IMAGE=enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
      - SKILLS_HOST_PATH=${PRISMOS_REPO_ROOT:-..}/skills
      - THREADS_HOST_PATH=${PRISMOS_HOME:-../backend/.prismos}/threads
      - KUBECONFIG_PATH=/root/.kube/config
      - NODE_HOST=host.docker.internal
      - K8S_API_SERVER=https://host.docker.internal:26443
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - prismos
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

networks:
  prismos:
    driver: bridge

volumes:
  postgres-data:
