[project]
name = "prismos"
version = "0.2.0a1"
description = "PrismOS governed Agent operating system with multi-tenant controls, sandbox execution, and extensible runtime foundations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deerflow-harness",
    "prismos-octop-capabilities",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.1.0",
    "uvicorn[standard]>=0.34.0",
    "lark-oapi>=1.4.0",
    "slack-sdk>=3.33.0",
    "python-telegram-bot>=21.0",
    "langgraph-sdk>=0.1.51",
    "langgraph-checkpoint-postgres>=2.1",
    "markdown-to-mrkdwn>=0.3.1",
    "alembic>=1.18.4",
    "sqlmodel>=0.0.37",
    "aiosqlite>=0.22.1",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.2",
    "greenlet>=3.3.2",
    "bcrypt>=5.0.0",
    "langchain-ollama>=1.1.0",
    # Knowledge document parsing (R2, migrated from Octop b6): text layer only.
    "pypdf>=6.21.2",
    # Security floors for transitive deps (2026-10 CVE batch).
    "pillow>=13.0",
    "urllib3>=2.8",
    "mcp>=1.30.0,<2",
    "multidict>=6.9.1",
    "oauthlib>=4.0.0",
    "anyio>=4.14.2",
    "certifi>=2026.10.19",
    "langgraph-sdk>=0.4.4",
    "pyjwt>=2.15.0",
    "langgraph-checkpoint-postgres>=3.1.3",
    "setuptools>=84.1.0",
    "brotli>=1.2.1",
    "python-docx>=1.1",
    "apscheduler>=3.10,<4",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.14.11"]

[tool.uv.workspace]
members = ["packages/harness", "packages/octop-capabilities"]

[tool.uv.sources]
deerflow-harness = { workspace = true }
prismos-octop-capabilities = { workspace = true }
