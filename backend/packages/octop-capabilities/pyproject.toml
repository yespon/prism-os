[project]
name = "prismos-octop-capabilities"
version = "0.1.0"
description = "Pinned Octop capability modules and content with PrismOS-neutral contracts"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0.3"]
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prismos_octop"]
