name: PrismOS Docker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate runtime build gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.26
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Enforce PrismOS brand identity
        run: python scripts/check_brand_identity.py

      - name: Check PrismOS environment compatibility
        run: bash scripts/test-prismos-env.sh

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Collect backend tests
        working-directory: backend
        run: uv run pytest --collect-only -q

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend quality audit (non-blocking)
        run: bash scripts/frontend-quality-audit.sh frontend

      - name: Upload frontend quality audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prismos-frontend-quality-audit
          path: frontend/frontend-quality-*
          if-no-files-found: warn

      - name: Validate root Compose configuration
        run: docker compose config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f docker/docker-compose.yaml config --quiet

      - name: Prepare local env files for development Compose validation
        run: |
          touch .env
          cp frontend/.env.example frontend/.env

      - name: Validate development Compose configuration
        run: docker compose -f docker/docker-compose-dev.yaml config --quiet

  backend:
    name: Build backend image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: prismos-backend:ci
          cache-from: type=gha,scope=prismos-backend
          cache-to: type=gha,mode=max,scope=prismos-backend

      - name: Export image
        run: docker save prismos-backend:ci | gzip > prismos-backend.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismos-backend
          path: prismos-backend.tar.gz

  frontend:
    name: Build frontend image (known quality debt)
    needs: validate
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          target: prod
          push: false
          load: true
          tags: prismos-frontend:ci
          cache-from: type=gha,scope=prismos-frontend
          cache-to: type=gha,mode=max,scope=prismos-frontend

      - name: Export image
        run: docker save prismos-frontend:ci | gzip > prismos-frontend.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismos-frontend
          path: prismos-frontend.tar.gz

  provisioner:
    name: Build provisioner image
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build provisioner
        uses: docker/build-push-action@v6
        with:
          context: docker/provisioner
          file: docker/provisioner/Dockerfile
          push: false
          load: true
          tags: prismos-provisioner:ci
          cache-from: type=gha,scope=prismos-provisioner
          cache-to: type=gha,mode=max,scope=prismos-provisioner

      - name: Export image
        run: docker save prismos-provisioner:ci | gzip > prismos-provisioner.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: prismos-provisioner
          path: prismos-provisioner.tar.gz
