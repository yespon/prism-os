name: Octop integration gates
on:
  push:
    branches: [main, 'codex/octop-*']
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'vendor/octop/**'
      - 'docs/superpowers/evidence/*octop*/**'
      - 'scripts/octop_*.py'
      - 'Makefile'
      - '.dockerignore'
      - 'docker/docker-compose.yaml'
      - 'docker/nginx/**'
      - 'docker/provisioner/**'
      - 'docker/octop-worker-compat/**'
      - '.github/workflows/octop-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.9.26
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify upstream archive and imported bytes
        run: make octop-verify
      - name: Install locked backend
        run: cd backend && uv sync --locked
      - name: Prepare scoped execution runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          docker build -f backend/Dockerfile -t prismos-scoped-execution:test .
      - name: Run backend regression
        env:
          PRISMOS_SCOPED_TEST_IMAGE: prismos-scoped-execution:test
        run: cd backend && uv run --locked pytest tests/ -q
      - name: Verify generated capability inventory
        run: make octop-inventory
      - name: Check host adapters
        run: >-
          cd backend && uv run --locked ruff check ../scripts/octop_auxiliary_task_probe.py ../scripts/octop_wsl_native_env.py ../scripts/octop_wsl_native_proxy.py tests/test_wsl_native_profile.py app/alerting/governed_native_reads.py app/alerting/governed_read_tool.py app/integrations/file_access.py tests/test_governed_native_reads.py tests/test_graph_execution_context.py packages/harness/deerflow/runtime.py packages/harness/deerflow/agents/lead_agent/agent.py app/integrations/octop/runtime_prompts.py app/runtime_adapters.py app/alerting/governed_ticket.py app/alerting/governed_ticket_tool.py tests/test_ticket_policy_changes.py packages/harness/deerflow/database/session.py app/services/terminal/credential_access.py tests/test_runtime_worker_bootstrap.py tests/test_langgraph_proxy_nginx.py tests/test_nginx_runtime_resolution.py packages/harness/deerflow/tools/builtins/office_pptx_images.py tests/test_office_pptx_images.py ../scripts/octop_wsl_test_env.py ../scripts/octop_wsl_test_snapshot.py ../scripts/octop_office_task_probe.py ../scripts/octop_office_report_probe.py ../scripts/octop_office_unicode_probe.py tests/test_n04_deployment_snapshot.py ../scripts/octop_wsl_test_probe.py ../docker/n04-test/ticket_receiver.py tests/test_n04_ticket_receiver.py packages/harness/deerflow/tools/builtins/office_common.py packages/harness/deerflow/tools/builtins/office_xlsx.py packages/harness/deerflow/tools/builtins/office_pptx.py packages/harness/deerflow/tools/builtins/office_pdf.py packages/harness/deerflow/tools/builtins/office_fonts.py tests/test_office_pdf_fonts.py packages/harness/deerflow/tools/builtins/office_docx_images.py tests/test_office_docx_images.py tests/test_office_chart_editing.py tests/test_office_charts.py tests/test_office_xlsx.py tests/test_office_formats.py packages/harness/deerflow/tools/builtins/office_docx.py tests/test_office_docx.py packages/harness/deerflow/tools/tools.py app/services/terminal/socket_access.py tests/test_terminal_socket_sessions.py app/gateway/auth.py app/gateway/routers/auth.py app/gateway/session_authorization.py tests/test_auth_session_delivery.py tests/test_auth_middleware_status.py app/integrations/actor_authorization.py tests/native_auth_test_identity.py tests/test_runtime_actor_status.py tests/conftest.py tests/test_incident_diagnosis.py
          app/gateway/routers/assets.py app/services/terminal/credential_access.py scripts/rotate_encrypted_secrets.py tests/test_credential_asset_access.py ../scripts/octop_remote_smoke.py ../docker/provisioner/app.py ../docker/provisioner/scoped_commands.py tests/test_remote_scoped_commands.py tests/test_provisioner_kubeconfig.py packages/harness/deerflow/community/aio_sandbox/remote_command.py packages/harness/deerflow/community/aio_sandbox/remote_backend.py packages/harness/deerflow/community/aio_sandbox/backend.py packages/harness/deerflow/config/sandbox_config.py app/integrations/octop app/gateway/resource_authorization.py tests/test_resource_catalog_access.py tests/test_auxiliary_resource_runtime.py tests/resource_test_identity.py tests/test_tenant_context_on_config_routers.py packages/harness/deerflow/skills/parser.py app/runtime_adapters.py packages/harness/deerflow/runtime.py packages/harness/deerflow/agents/lead_agent/agent.py tests/test_runtime_adapters.py app/gateway/routers/agent_catalog.py app/services/terminal/access.py app/services/terminal/session.py app/agent/terminal_tools.py app/agent/terminal_graph.py app/gateway/routers/terminal.py tests/test_terminal_access_boundaries.py tests/test_terminal_multihost.py tests/test_terminal_security.py tests/test_terminal_trimming.py tests/test_lead_agent_model_resolution.py
          tests/test_octop_integration.py tests/test_octop_catalog_integrity.py packages/octop-capabilities/src/prismos_octop/catalog.py
          ../scripts/octop_worker_compat.py ../scripts/octop_worker_probe.py ../docker/octop-worker-compat/worker_rpc.py tests/test_octop_worker_compat.py ../scripts/octop_sync.py ../scripts/octop_external.py ../scripts/octop_inventory.py ../scripts/octop_upgrade_probe.py ../scripts/octop_gateway_smoke.py ../scripts/octop_wheel_verify.py
          packages/octop-capabilities/src/prismos_octop/source_policy.py tests/test_octop_inventory.py tests/test_octop_source_curation.py
          packages/octop-capabilities/src/prismos_octop/presentation.py tests/test_octop_presentation.py
          app/gateway/bootstrap_admin.py tests/test_bootstrap_identity_schema.py tests/test_octop_source_fetch.py
          ../scripts/octop_source_fetch.py ../scripts/octop_compose_smoke.py
          packages/octop-capabilities/src/prismos_octop/resources.py tests/test_octop_resources.py tests/test_octop_resource_installations.py tests/test_octop_skill_packages.py
          app/integrations/skill_imports.py app/integrations/skill_mutations.py tests/test_skill_mutation_boundaries.py tests/test_skill_enablement_boundaries.py tests/test_skill_manual_creation.py tests/test_skill_resource_deletion.py tests/test_skill_deletion_process.py tests/test_skill_member_tools.py tests/test_skill_scoped_commands.py tests/test_skill_reference_transactions.py tests/test_agent_skill_references.py tests/test_agent_copy_share_boundaries.py tests/test_custom_agent.py tests/test_legacy_default_scope.py tests/test_diagnosis_authorization.py tests/test_langgraph_proxy.py app/alerting/governed_ticket_tool.py app/alerting/governed_read_tool.py app/platform/execution/trust.py app/alerting/diagnosis_authorization.py app/integrations/agent_skill_references.py app/integrations/agent_skill_members.py app/integrations/skill_command_views.py packages/harness/deerflow/sandbox/tools.py packages/harness/deerflow/sandbox/sandbox_provider.py packages/harness/deerflow/sandbox/local/scoped_command.py packages/harness/deerflow/sandbox/local/local_sandbox_provider.py packages/harness/deerflow/community/aio_sandbox/scoped_command.py packages/harness/deerflow/community/aio_sandbox/aio_sandbox_provider.py app/integrations/skill_reference_transactions.py app/integrations/skill_deletions.py packages/harness/deerflow/skills/resource_deletion_files.py packages/harness/deerflow/skills/install_receipts.py packages/harness/deerflow/skills/installer.py
          app/alerting/diagnosis_delivery.py tests/test_diagnosis_delivery.py app/alerting/diagnosis_run_control.py tests/test_diagnosis_run_control.py tests/test_runtime_source_revocation.py app/alerting/ingest.py tests/test_langgraph_proxy_stream.py app/integrations/file_access.py app/gateway/file_authorization.py app/gateway/routers/artifacts.py app/gateway/routers/threads.py app/gateway/routers/uploads.py packages/harness/deerflow/sandbox/file_access.py packages/harness/deerflow/tools/builtins/view_image_tool.py packages/harness/deerflow/tools/builtins/present_file_tool.py tests/test_file_access_boundaries.py tests/test_file_access_http.py
          tests/test_skill_import_recovery.py tests/test_skill_resource_identity.py packages/harness/deerflow/skills/resource_identity.py packages/harness/deerflow/skills/loader.py packages/harness/deerflow/database/user_config_service.py tests/test_skills_installer.py tests/test_skills_scope_router.py ../scripts/octop_skill_postgres.py
      - name: Isolated external SDK and MCP compatibility
        run: |
          backend/.venv/bin/python scripts/octop_worker_compat.py --output-dir "$PWD/backend/tmp/octop-worker-ci"
          docker build -t prismos-octop-worker-compat:ci backend/tmp/octop-worker-ci
          image_id=$(docker image inspect prismos-octop-worker-compat:ci --format '{{.Id}}')
          backend/.venv/bin/python scripts/octop_worker_probe.py --image "$image_id" --output "$RUNNER_TEMP/octop-worker-compat.json"
      - name: Pinned previous source and host upgrade rollback
        run: make octop-upgrade OCTOP_UPGRADE_DIR="$RUNNER_TEMP/octop-upgrade"
      - name: Real Gateway smoke with temporary databases
        run: make octop-smoke
      - name: Build capability distribution
        run: cd backend && uv build --package prismos-octop-capabilities
      - name: Verify installed wheel resources
        run: cd backend && uv run --locked python ../scripts/octop_wheel_verify.py dist/prismos_octop_capabilities-0.1.0-py3-none-any.whl --sdist dist/prismos_octop_capabilities-0.1.0.tar.gz
      - name: Install locked frontend
        run: cd frontend && pnpm install --frozen-lockfile
      - name: Typecheck and frontend regression
        run: cd frontend && pnpm typecheck && pnpm test:unit --maxWorkers=2
      - name: Build production frontend
        run: cd frontend && pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: octop-capability-distributions
          path: backend/dist/*
      - name: Production Docker and isolated PostgreSQL Compose
        run: make octop-compose OCTOP_COMPOSE_EVIDENCE="$RUNNER_TEMP/octop-compose"
      - name: Native Skill recovery against isolated PostgreSQL
        run: make octop-skill-postgres OCTOP_SKILL_PG_DIR="$RUNNER_TEMP/octop-skill-postgres"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: octop-runtime-verification
          path: |
            ${{ runner.temp }}/octop-worker-compat.json
            ${{ runner.temp }}/octop-upgrade/upgrade.json
            ${{ runner.temp }}/octop-compose/*
            ${{ runner.temp }}/octop-skill-postgres/*
