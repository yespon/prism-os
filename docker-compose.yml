# PrismOS production Compose compatibility entrypoint.
#
# The canonical production definition lives in docker/docker-compose.yaml.
# Keeping this thin include preserves the familiar root command while avoiding
# a second production service definition that can drift from the deploy script.
#
# Usage:
#   docker compose -f docker-compose.yml up -d
#   ./scripts/deploy.sh up

include:
  - path: ./docker/docker-compose.yaml
